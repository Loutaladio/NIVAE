[build]
  publish = "dist"
  command = "rm -rf dist && mkdir -p dist/assets && cp index.html styles.css app.js manifest.webmanifest sw.js manus-routes.json dist/ && cp -R assets/* dist/assets/

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
